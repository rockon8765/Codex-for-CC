# Linux 原生回歸 — 讓 linux/ 樹不必依賴「維護者剛好有 Linux 機器」。
#
# 為什麼需要：本 repo 的三平台鏡像中，linux/ 的改動長期只能在 Windows 上以 node 做
# 跨宿主邏輯回歸。那種跑法**證明力有限** —— 例如 gate-cases 用 `__TMP__` 佔位符展開成
# os.tmpdir()，在 Windows 上含大寫、在 Linux 上是全小寫 /tmp，同一組案例的區辨性因此
# 完全不同（2026-07-26 的變異測試實證：mac 式 toLowerCase 的錯誤移植，在 Windows 主機
# 上會被 3 個案例擋下，在真 Linux 上那 3 案卻照樣全綠）。
# GitHub-hosted 的 Ubuntu runner 是真 Linux kernel + GNU userland + 原生 node，跑在這裡才算數。
# （實際映像版本與檔案系統**不**寫死在註解裡——由下方「環境」步驟印進 log 當證據。）
name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # action 一律釘 commit SHA，不用可移動的 vN tag（供應鏈：tag 可被重指）。
      # SHA 由 `gh api repos/<r>/git/ref/tags/v7` 自行解析取得，非抄來的。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 這個 workflow 只讀 repo、不推東西；留著 checkout 寫進 git config 的 token
          # 只是讓後續任意步驟（含 PR 分支帶進來的測試腳本）多一個可用憑證。
          persist-credentials: false

      # 釘 22.x：2026-07-26 的 WSL2 原生驗收就是 Node v22.23.1，保持同一大版本以免
      # 用不同 runtime 解讀同一組期望值。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          # 本 repo 沒有 npm 相依，不需要（也不該）依 package.json 自動開快取。
          package-manager-cache: false

      - name: 環境（留在 log 裡當證據）
        run: |
          uname -a
          . /etc/os-release && echo "distro: $PRETTY_NAME"
          # 別在文件裡宣稱 runner 的檔案系統——當場量出來寫進 log。
          findmnt -T . -o TARGET,SOURCE,FSTYPE || true
          node -v
          node -p "process.platform + ' ' + process.arch + ' tmpdir=' + require('os').tmpdir()"
          bash --version | head -1
          stat --version | head -1

      # SUT 身分：測試臺在找不到 repo 內 hook 時會 fallback 到 ~/.claude/hooks，
      # 那會變成「驗到安裝版而非待驗 bytes」的假綠。runner 上不該有這個目錄，明確斷言。
      - name: 斷言無 shadow hook
        run: |
          if [ -e "$HOME/.claude" ]; then
            echo "::error::runner 上出現 ~/.claude，測試可能驗到非待驗 bytes"
            exit 1
          fi
          echo "no ~/.claude — SUT 只會是 repo 內的 hook"

      - name: node --check（hook 語法）
        run: node --check "linux/hooks/super-mode-consult-gate.js"

      - name: bash -n（腳本與測試臺語法）
        run: |
          for f in linux/skills/超級模式/scripts/*.sh linux/skills/超級模式/tests/*.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: gate-cases 回歸
        run: node "linux/skills/超級模式/tests/run-gate-tests.js"

      # 這支抓的是「hook 的攔截清單」與「settings matcher」漂移 —— 另外兩支測試都是直接
      # 呼叫 decide()，matcher 漏列時它們照樣全綠，但真實情況是 hook 根本不會被叫起。
      - name: matcher-contract
        run: node "linux/skills/超級模式/tests/matcher-contract.test.js" --repo

      # 這支是**平台無關**的頂層測試（tools/ 與 tests/ 都不在 linux/ 底下），
      # 刻意接進本 workflow：probe 決定使用者會不會進入「動 settings」的流程，
      # 之前它內嵌在 markdown 裡、沒有任何 gate 攔得住回歸。
      - name: probe-gate-registration 回歸
        run: node "tests/probe-gate-registration.test.js"

      # gate 辨識的共用模組。**平台無關**，但它同時驗「三平台鏡像逐位元相同」——
      # 這是唯一會實際比對 windows／macos／linux 三份 bytes 的地方，Linux runner
      # 完全做得到（比的是檔案內容，不是 runtime 行為）。
      # --strict：CI 只看退出碼，SKIP 必須也算失敗。
      - name: gate-registration 共用模組回歸（--strict）
        run: node "tests/gate-registration.test.js" --strict

      # matcher-contract 的 CLI 層（旗標、attestation、退出碼、不得噴 stack trace）。
      # 每案都重建一棵最小樹再開子程序，所以它同時驗到「已安裝佈局下相鄰 require 有效」
      # 與「installed 佈局不會偷偷回頭讀 repo」。
      - name: matcher-contract CLI 回歸
        run: node "tests/matcher-contract-cli.test.js"

      # probe 的判定矩陣：47+ 個輸入各自釘死 RESULT_CODE 與退出碼。
      # 與上面那支 probe 測試抓的東西不同 —— 那支抓「訊息對不對」，這支抓
      # 「判定矩陣有沒有整片坍縮到同一個 code」。--baseline 另可與任一 git ref 逐位元比對。
      - name: probe 判定矩陣
        run: node "tests/probe-verdict-cases.test.js"

      # 這裡也是 CI 唯一會**真的建出 symlink** 的地方（Windows 非管理員建不了，
      # 那邊該案會標 SKIP）。所以這一步同時是那條守衛的原生覆蓋。
      # --strict：CI 只看退出碼，所以 SKIP 必須也算失敗，否則守衛沒跑到卻是綠燈。
      # Linux runner 建得出 symlink、也不是 root，兩個變異注入案都應該真的跑到。
      - name: backup-settings 回歸（--strict：不允許 SKIP）
        run: node "tests/backup-settings.test.js" --strict

      - name: e2e（會印 GATE_UNDER_TEST / GATE_BLOB 供核對）
        run: bash "linux/skills/超級模式/tests/run-e2e.sh"

      - name: codex-check 合成測試臺
        run: bash "linux/skills/超級模式/tests/codex-check.tests.sh"

      - name: consult-schema
        run: bash "linux/skills/超級模式/tests/consult-schema.tests.sh"

      # 非空驗證：把 linux 的 case-preserving helper 換成 mac 版的 toLowerCase()，
      # gate-cases 必須變紅。若這步「變異後仍全綠」，代表回歸網對這條平台語義失效了。
      - name: 變異測試（守住 case-preserving 的區辨性）
        run: |
          cp -r linux "$RUNNER_TEMP/linux-mut"
          MUT="$RUNNER_TEMP/linux-mut/hooks/super-mode-consult-gate.js"
          sed -i 's/String(cmd)\.replace(/String(cmd).toLowerCase().replace(/' "$MUT"
          # 先確認變異真的套用了 —— helper 若被改名/重寫，這步要當場失敗，而不是
          # 讓「變異後仍全綠」被誤讀成回歸網失效。
          grep -q 'String(cmd).toLowerCase().replace(' "$MUT" || {
            echo "::error::變異點不存在 — isRunnerTouchingSensitive 已被改寫，請更新本步驟"
            exit 1
          }
          node --check "$MUT"
          if node "$RUNNER_TEMP/linux-mut/skills/超級模式/tests/run-gate-tests.js"; then
            echo "::error::變異後仍全綠 —— case-preserving 已無測試守護（假綠）"
            exit 1
          fi
          echo "變異已被測試抓到 — 回歸網有效"
